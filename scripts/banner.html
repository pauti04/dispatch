<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dispatch banner</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Crimson+Pro:ital,wght@0,400;1,400&family=Inter:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    @keyframes none {} /* prevent any anim flicker */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1280px;
      height: 640px;
      background: #0d0c0a;
      overflow: hidden;
      font-family: "Crimson Pro", Georgia, serif;
      color: #f4ecdc;
      font-feature-settings: "kern" 1, "liga" 1;
    }
    body {
      background:
        radial-gradient(1100px 600px at 50% -10%, rgba(201, 161, 74, 0.12), transparent 60%),
        radial-gradient(500px 300px at 90% 90%, rgba(201, 161, 74, 0.06), transparent 70%),
        #0d0c0a;
      position: relative;
    }
    /* Paper grain overlay */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }
    .wrap {
      position: relative;
      padding: 56px 80px;
      height: 640px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a89c84;
      font-weight: 600;
    }
    .rule {
      border: none;
      border-top: 1px solid #3a3530;
      margin: 16px 0 0;
    }
    .center {
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 4px;
    }
    h1 {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 160px;
      line-height: 0.95;
      letter-spacing: 0.01em;
      margin: 0 0 14px;
    }
    .double-rule {
      width: 100%;
      max-width: 980px;
      border: none;
      border-top: 1px solid #3a3530;
      border-bottom: 1px solid #3a3530;
      height: 4px;
      margin: 6px 0 18px;
    }
    .subscript-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 980px;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #c9a14a;
      font-weight: 600;
    }
    .tagline {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #a89c84;
      font-weight: 600;
      font-style: normal;
    }
    .pitch {
      margin-top: 38px;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 38px;
      line-height: 1.15;
      color: #f4ecdc;
      max-width: 980px;
    }
    .pitch em {
      color: #c9a14a;
      font-style: italic;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Inter", system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #a89c84;
    }
    .footer .left {
      color: #c9a14a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="topbar">
        <span>Vol. I &middot; No. 0138</span>
        <span>Tuesday, May 19, 2026</span>
        <span>Edition 8:00 AM</span>
      </div>
      <hr class="rule" />
    </header>

    <section class="center">
      <h1>Dispatch</h1>
      <hr class="double-rule" />
      <div class="subscript-row">
        <span class="tagline">The morning paper for working developers</span>
        <span>"The wire, edited."</span>
      </div>
      <p class="pitch">
        Reading HackerNews is a part-time job.&nbsp;<em>Outsource it.</em>
      </p>
    </section>

    <footer class="footer">
      <span class="left">github.com/pauti04/dispatch</span>
      <span>AI · Editorial · 5 minutes / weekday</span>
    </footer>
  </div>
</body>
</html>
